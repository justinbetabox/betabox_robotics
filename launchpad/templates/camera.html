{% extends "interior.html" %}

{% block body_class %}
    interior-body camera-page
{% endblock %}

{% block interior_styles %}
    <link
        rel="stylesheet"
        href="/static/css/camera.css"
    >
{% endblock %}

{% block page_content %}
    <section
        class="camera-view"
        data-video-state="connecting"
        aria-label="Live robot vision"
    >
        <video
            id="live-camera"
            class="camera-video"
            autoplay
            playsinline
            muted
        ></video>

        <div
            id="camera-status"
            class="
                camera-status
                connection-status
                status-connecting
            "
            role="status"
            aria-live="polite"
        >
            Connecting…
        </div>

        <div class="camera-message">
            Connecting vision…
        </div>
    </section>
{% endblock %}

{% block interior_scripts %}
    <script
        type="module"
        src="/static/js/camera.js"
    ></script>
{% endblock %}
