<div
    class="identity-badge"
    aria-label="Current Launchpad user"
>
    <div class="identity-badge__details">
        <strong class="identity-badge__name">
            {{ identity.display_name }}
        </strong>

        <span class="identity-badge__workspace">
            {% if is_guest %}
                Temporary Workspace
            {% else %}
                Persistent Workspace
            {% endif %}
        </span>
    </div>

    {% if is_guest %}
        <button
            class="button button-secondary identity-badge__action"
            type="button"
            data-login-open
        >
            Login
        </button>
    {% else %}
        <form
            class="identity-badge__form"
            method="post"
            action="/logout"
        >
            <input
                type="hidden"
                name="return_to"
                value="/"
                data-return-to
            >

            <button
                class="button button-secondary identity-badge__action"
                type="submit"
            >
                Log Out
            </button>
        </form>
    {% endif %}
</div>
