<dialog
    class="login-modal"
    id="student-login-modal"
    aria-labelledby="student-login-title"
    aria-modal="true"
>
    <div class="login-modal__content">
        <div class="login-modal__header">
            <div>
                <p class="login-modal__eyebrow">
                    Persistent workspace
                </p>

                <h2 id="student-login-title">
                    Login
                </h2>
            </div>

            <button
                class="button button-secondary login-modal__close"
                type="button"
                aria-label="Close student login"
                data-login-close
            >
                ×
            </button>
        </div>

        {% if login_failed %}
            <div
                class="login-modal__error"
                role="alert"
            >
                The username or password was incorrect.
            </div>
        {% endif %}

        <form
            class="login-modal__form"
            method="post"
            action="/login"
        >
            <input
                type="hidden"
                name="return_to"
                value="/"
                data-return-to
            >

            <label class="login-modal__field">
                <span>Username</span>

                <input
                    type="text"
                    name="username"
                    autocomplete="username"
                    autocapitalize="none"
                    spellcheck="false"
                    required
                >
            </label>

            <label class="login-modal__field">
                <span>Password</span>

                <input
                    type="password"
                    name="password"
                    autocomplete="current-password"
                    required
                >
            </label>

            <button
                class="button login-modal__submit"
                type="submit"
            >
                Sign In
            </button>
        </form>
    </div>
</dialog>
