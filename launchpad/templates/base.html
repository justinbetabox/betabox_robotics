<!doctype html>
<html
    lang="en"
    {% if launchpad_preferences["theme"] != "system" %}
        data-theme="{{ launchpad_preferences['theme'] }}"
    {% endif %}
    data-reduced-motion="{{
        'true'
        if launchpad_preferences["reduced_motion"]
        else 'false'
    }}"
    data-larger-text="{{
        'true'
        if launchpad_preferences["larger_text"]
        else 'false'
    }}"
    data-compact-layout="{{
        'true'
        if launchpad_preferences["compact_layout"]
        else 'false'
    }}"
>
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}
            Betabox Launchpad
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url('static', filename='css/tokens.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url('static', filename='css/components.css') }}"
    >

    {% block page_styles %}
    {% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
    <a
        class="skip-link"
        href="#main-content"
    >
        Skip to main content
    </a>

    {% block body %}
    {% endblock %}

    {% include "_login_modal.html" %}

    <script src="{{ url('static', filename='js/theme.js') }}"></script>
    <script src="{{ url('static', filename='js/launchpad.js') }}"></script>

    {% block shared_scripts %}
    {% endblock %}

    {% block page_scripts %}
    {% endblock %}
</body>
</html>
